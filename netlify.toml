# The site now lives on Vercel (https://interactive-kabbalah.vercel.app).
# This Netlify site only forwards every request there, keeping the path and
# query string, so old links and search results keep working.
# No Next.js build runs on Netlify: it publishes the tiny static folder below.

[build]
  publish = "netlify-redirect"

[[redirects]]
  from = "/*"
  to = "https://interactive-kabbalah.vercel.app/:splat"
  status = 301
  force = true